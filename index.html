<script>
  // Thema vóór de eerste render zetten, anders flitst het scherm.
  try {
    var opgeslagen = JSON.parse(localStorage.getItem('cursus-elektro-voortgang') || '{}');
    if (opgeslagen.instellingen && opgeslagen.instellingen.thema) {
      document.documentElement.dataset.theme = opgeslagen.instellingen.thema;
    }
  } catch (e) { /* eerste start */ }
</script>

        <button id="btnReset" class="danger"><svg class="icon" viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9A5 5 0 1 1 12.5 5.3"/><path d="M14 2.5V6h-3.5"/></svg> Voortgang wissen</button>
      </div>
    </div>
  </div>
</header>
