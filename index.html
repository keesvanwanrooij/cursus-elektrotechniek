<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0F1216">
<script>
  // Thema vóór de eerste render zetten, anders flitst het scherm.
  try {
    var opgeslagen = JSON.parse(localStorage.getItem('cursus-elektro-voortgang') || '{}');
    if (opgeslagen.instellingen && opgeslagen.instellingen.thema) {
      document.documentElement.dataset.theme = opgeslagen.instellingen.thema;
    }
  } catch (e) { /* eerste start */ }
</script>

<header class="topbar">
  <a class="brand" href="#/">
    <span class="bolt">⚡</span>
    <span>Elektrotechniek<small>Praktijkcursus</small></span>
  </a>
  <nav class="topnav">
    <a href="#/" data-route="dash">Mijn cursus</a>
    <a href="#/naslag" data-route="naslag">Naslag</a>
  </nav>
  <span class="spacer"></span>
  <div class="topactions">
    <button class="btn sm" id="installBtn" hidden>⭳ App installeren</button>
    <button class="iconbtn" id="themeToggle" title="Wissel tussen donker en licht thema" aria-label="Wissel thema">◐</button>
    <div class="menu">
      <button class="iconbtn" id="menuBtn" title="Voortgang beheren" aria-label="Menu">⋯</button>
      <div class="menupanel" id="menuPanel" hidden>
        <button id="btnExport">⭳ Voortgang exporteren</button>
        <button id="btnImport">⭱ Voortgang importeren</button>
        <hr>
        <button id="btnReset" class="danger">⟲ Voortgang wissen</button>
      </div>
    </div>
  </div>
</header>

<main id="app" class="wrap"><!-- gerenderd door views.js --></main>

<input type="file" id="fileInput" accept="application/json" hidden>
